<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f2e8">
<title>Munro Quay · Departure board</title>
<style>
:root {
  color-scheme: light;
  --paper: #f5f2e8;
  --ink: #182832;
  --muted: #515c60;
  --line: #c9cbc0;
  --blue: #164eaa;
  --poster: #204fa9;
  --cream: #fff6db;
  --orange: #ff8a5a;
  --font: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}
* {box-sizing:border-box}
body {margin:0; background:var(--paper); color:var(--ink); font:16px/1.4 var(--font); -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
h1,h2,h3,p {margin:0}
button {font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible {outline:3px solid var(--blue); outline-offset:3px; z-index:1}
.frame {max-width:1440px; margin-inline:auto; padding-inline:clamp(22px,4.375vw,76px)}
.topbar .frame {display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:90px}
.topbar {border-bottom:1px solid #abb0a6}
.brand {display:flex; align-items:center; gap:15px; font-size:28px; font-weight:720; letter-spacing:-.04em; line-height:1}
.brand svg {width:47px; height:43px; flex:none}
.clock {display:grid; grid-template-columns:auto auto; column-gap:18px; align-items:center; font-size:13px; text-align:right; line-height:1.35}
.clock-label {display:block; color:var(--muted); font-size:12px}
.clock time {font-size:35px; line-height:1; font-weight:550; letter-spacing:-.055em}
.toolbar {display:flex; justify-content:space-between; align-items:center; gap:20px; padding:27px 0 24px}
h1 {font-size:clamp(31px,3.55vw,49px); font-weight:650; letter-spacing:-.029em; line-height:1.05}
.filters {display:flex; gap:2px; padding:3px; background:#e8e7db; border:1px solid #c8cabd; border-radius:5px}
.filters button {background:none; border:0; border-radius:3px; min-height:36px; padding:5px 17px; color:#384846; font-size:14px; font-weight:550; white-space:nowrap}
.filters button:hover {background:#d9ded5}
.filters button[aria-pressed=true] {background:var(--blue); color:#fff; font-weight:660}
.layout {display:grid; grid-template-columns:minmax(280px,.91fr) minmax(0,1.85fr); gap:clamp(26px,3.65vw,57px); align-items:start}
.poster {position:relative; overflow:hidden; isolation:isolate; background:var(--poster); color:var(--cream); display:flex; flex-direction:column; align-self:stretch; min-width:0}
.poster-info {position:relative; z-index:1; padding:26px 25px 0}
.poster-label {font-size:16px; font-weight:600; letter-spacing:-.018em; margin-bottom:35px}
.pier-sign {position:absolute; right:23px; top:24px; text-align:center; display:grid; justify-items:center; gap:0; color:var(--cream); line-height:1; border:1.5px solid #b2c5de; border-radius:3px; padding:6px 10px 4px; min-width:46px}
.pier-sign span {font-size:12px; font-weight:620}
.pier-sign b {font-size:29px; font-weight:690; line-height:1.03}
.hero-time {font-size:clamp(67px,6.55vw,102px); font-weight:590; letter-spacing:-.045em; line-height:1; display:block; margin-left:-.04em}
.hero-when {font-size:14px; color:#dce7ff; margin-top:4px; font-weight:500}
.hero-to {font-size:clamp(31px,3.18vw,48px); line-height:1.08; font-weight:620; letter-spacing:-.035em; margin:23px 0 7px}
.hero-state {display:flex; align-items:center; gap:7px; font-size:14px; font-weight:550; line-height:1.35}
.icon {width:16px; height:16px; display:inline-block; vertical-align:middle; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.hero-state .icon {width:17px; height:17px}
.poster .open-detail {position:relative; z-index:1; align-self:flex-start; margin:17px 0 0 25px; display:inline-flex; align-items:center; gap:9px; color:var(--cream); font-size:13px; font-weight:550; background:transparent; border:none; border-bottom:1px solid #a7bde1; padding:4px 0}
.poster .open-detail:focus-visible {outline-color:var(--cream)}
.poster .open-detail:hover {border-bottom-color:var(--cream)}
.open-detail .icon {width:12px; height:12px}
.art {display:block; width:100%; margin-top:auto; min-height:115px; overflow:hidden; aspect-ratio:400/151; max-height:196px}
.art svg.mobile-art {display:none}
.art svg {display:block; width:100%; height:100%}
.timetable {min-width:0}
.schedule-title {display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:1px 0 16px; border-bottom:2px solid var(--ink)}
.schedule-title h2 {font-size:26px; font-weight:640; letter-spacing:-.04em; line-height:1.15}
#count {font-size:13px; color:var(--muted); white-space:nowrap}
.grid {display:grid; grid-template-columns: minmax(64px,.68fr) minmax(112px,1.25fr) minmax(43px,.46fr) minmax(119px,1.1fr) 10px; column-gap:12px; align-items:center}
.mobile-col-name {display:none}
.columns {font-size:12px; color:var(--muted); font-weight:550; min-height:32px}
.dayline {font-size:12px; font-weight:650; display:flex; align-items:center; gap:12px; color:var(--blue); line-height:1.3; padding:5px 0; background:var(--paper)}
.dayline:after {content:""; flex:1; border-bottom:1px solid #a0b3be}
.group + .group {margin-top:9px}
.row {appearance:none; width:100%; border:0; border-bottom:1px solid var(--line); background:transparent; text-align:left; position:relative; min-height:55px; padding:6px 0; line-height:1.22}
.row:hover {background:#e8ece3}
.row:focus-visible {outline-offset:1px}
.sched {font-size:21px; font-weight:550; letter-spacing:-.028em}
.dest {font-size:clamp(16px,1.42vw,20px); font-weight:610; letter-spacing:-.032em}
.dest small {display:none}
.pier {font-size:14px; font-weight:490}
.status-line {display:inline-flex; align-items:center; gap:6px; font-size:13px; line-height:1.25; font-weight:650}
.normal .status-line {font-weight:500; color:#41514d}
.delayed .status-line {color:#824200}
.cancelled .status-line {color:#a13627}
.boarding .status-line {color:var(--blue)}
.status .sub {display:block; padding-left:22px; font-size:12px; color:var(--muted); margin-top:2px; line-height:1.3}
.row-arrow {width:8px; height:13px; color:#67736f; justify-self:end}
footer {margin:18px 0 23px; color:var(--muted); display:flex; align-items:center; justify-content:flex-end; gap:7px; font-size:12px}
footer .icon {width:14px; height:14px}
.symbols {width:0; height:0; position:absolute; overflow:hidden}
dialog {width:min(427px,calc(100% - 30px)); padding:0; max-height:calc(100% - 32px); overflow:auto; color:var(--ink); background:var(--paper); border:0; border-top:7px solid var(--poster); box-shadow:0 16px 64px #16273940}
dialog::backdrop {background:#18293378}
.detail {padding:18px 24px 24px}
.detail-top {display:flex; align-items:center; justify-content:space-between; gap:16px}
.detail-kicker {display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--blue)}
.detail-kicker .icon {width:19px; height:19px}
.close {width:42px; height:42px; margin-right:-9px; display:grid; place-items:center; border:0; background:transparent; border-radius:3px}
.close:hover {background:#e8e7db}
.close .icon {width:20px; height:20px}
.detail h2 {font-size:36px; font-weight:640; letter-spacing:-.045em; line-height:1.08; margin:12px 0 13px}
.detail-meta {display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:13px 0; border-block:1px solid var(--line)}
.detail-meta dt {font-size:12px; color:var(--muted)}
.detail-meta dd {font-size:18px; margin:2px 0 0; font-weight:550; letter-spacing:-.02em}
.detail-meta dd span {display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:2px; letter-spacing:0}
#detail-state {margin:13px 0 23px}
.summary h3 {font-size:17px; letter-spacing:-.025em; margin-bottom:6px}
#summary-text {font-size:16px; line-height:1.55}
.detail-bottom {display:flex; align-items:center; gap:12px; margin-top:20px}
.copy {display:flex; align-items:center; gap:8px; min-height:42px; padding:8px 13px; color:#fff; border:0; border-radius:3px; background:var(--blue); font-size:14px; font-weight:600}
.copy:hover {background:#133d89}
#feedback {font-size:13px; color:var(--blue)}
@media(min-width:1000px) and (min-height:830px) {
  .toolbar {padding-block:32px}
  .row {min-height:64px}
}
@media(max-width:950px) and (min-width:721px) {
  .frame {padding-inline:24px}
  .layout {grid-template-columns:minmax(225px,.74fr) minmax(0,1.65fr); gap:22px}
  .poster-info {padding:20px 16px 0}
  .poster .open-detail {margin-left:16px}
  .pier-sign {right:14px; top:16px; min-width:39px; padding:5px 7px 3px}
  .poster-label {font-size:14px}
  .hero-to {font-size:29px}
  .hero-time {font-size:64px}
  .grid {grid-template-columns:56px minmax(89px,1.12fr) 34px minmax(104px,1fr) 7px; gap:7px}
  .status .sub {padding-left:0}
  .pier {font-size:13px}
  .row {min-height:56px}
}
@media(max-width:720px) {
  .frame {padding-inline:clamp(14px,4vw,24px)}
  .topbar .frame {min-height:65px}
  .brand {gap:9px; font-size:22px}
  .brand svg {width:33px; height:31px}
  .clock {display:flex; flex-direction:column-reverse; align-items:flex-end; gap:3px; font-size:12px; line-height:1.15}
  .clock-label {display:none}
  .clock time {font-size:23px; letter-spacing:-.04em}
  .toolbar {display:grid; gap:10px; padding:15px 0 12px}
  h1 {font-size:31px}
  .filters {justify-self:start}
  .filters button {min-height:35px; padding-inline:16px; font-size:13px}
  .layout {grid-template-columns:1fr; gap:17px}
  .poster {min-height:179px; display:block; padding-bottom:16px}
  .poster-info {padding:13px 15px 0}
  .poster-label {font-size:13px; margin-bottom:8px}
  .pier-sign {top:13px; right:14px; min-width:37px; padding:4px 6px 3px}
  .pier-sign span {font-size:12px}
  .pier-sign b {font-size:24px}
  .hero-time {font-size:50px}
  .hero-when {font-size:12px; margin-top:1px}
  .hero-to {font-size:26px; margin:10px 0 3px}
  .hero-state {font-size:12px; gap:4px}
  .hero-state .icon {width:14px; height:14px}
  .poster-label:after {content:" →"; margin-left:3px}
  .poster .open-detail {position:absolute; inset:0; width:100%; height:100%; z-index:2; margin:0; border:0; padding:0; font-size:0}
  .poster .open-detail .icon {display:none}
  .poster .open-detail:focus-visible {outline-offset:-4px}
  .art {position:absolute; inset:auto 0 0; width:100%; height:100px; min-height:0; max-height:none; aspect-ratio:auto; z-index:0; pointer-events:none}
  .art svg.desktop-art {display:none}
  .art svg.mobile-art {display:block}
  .schedule-title {padding:0 0 7px}
  .schedule-title h2 {font-size:22px}
  #count {font-size:12px}
  .full-col-name {display:none}
  .mobile-col-name {display:inline}
  .columns {min-height:29px; font-size:12px}
  .grid {grid-template-columns:54px minmax(85px,1fr) minmax(125px,1.15fr) 7px; gap:7px}
  .row {min-height:48px; padding-block:5px}
  .row .pier,.columns .pier-col {display:none}
  .sched {font-size:16px; letter-spacing:-.035em}
  .dest {font-size:15px; line-height:1.22; letter-spacing:-.025em}
  .dest small {display:block; font-size:12px; line-height:1.3; font-weight:480; color:var(--muted); letter-spacing:0; margin-top:2px}
  .dayline {font-size:12px; padding:3px 0}
  .group + .group {margin-top:6px}
  .status-line {font-size:12px; gap:4px}
  .status-line .icon {width:13px; height:13px}
  .status .sub {font-size:12px; padding-left:17px; margin-top:2px}
  footer {margin:11px 0 18px; justify-content:flex-start; font-size:11px}
}
@media(min-width:470px) and (max-width:720px) {
  .toolbar {display:flex}
  h1 {font-size:27px}
  .filters button {padding-inline:11px}
  .art {width:100%; height:116px}
  .row {min-height:52px}
  .grid {grid-template-columns:64px minmax(95px,1.1fr) 42px minmax(100px,1fr) 7px}
  .row .pier,.columns .pier-col {display:block}
  .dest small {display:none}
}
@media(max-width:374px) {
  .frame {padding-inline:12px}
  .grid {grid-template-columns:48px minmax(86px,1fr) minmax(114px,1.17fr) 6px; gap:6px}
  .art {height:91px}
}
</style>
</head>

<script>
const days = ['Saturday, 14 March', 'Sunday, 15 March'];
const now = 23 * 60 + 42;
const sailings = [
  {day:0, time:'23:45', to:'Lark Island', pier:2, type:'delayed', revised:{day:1, time:'00:10'}, note:'Late inbound vessel', summary:'Saturday’s 23:45 sailing to Lark Island from Pier 2 is delayed because the inbound vessel is late. It is now due to depart at 00:10 on Sunday.'},
  {day:0, time:'23:50', to:'Westhaven', pier:1, type:'cancelled', note:'High winds', summary:'Saturday’s 23:50 sailing to Westhaven from Pier 1 is cancelled because of high winds. Sunday’s 00:20 departure from Pier 1 is a separate Westhaven service and is on time.'},
  {day:0, time:'23:55', to:'Alder Point', pier:3, type:'boarding', note:'On time', summary:'Saturday’s 23:55 sailing to Alder Point is boarding at Pier 3 and is on time.'},
  {day:1, time:'00:05', to:'Ork Ferry', pier:1, type:'normal'},
  {day:1, time:'00:20', to:'Westhaven', pier:1, type:'normal', summary:'Sunday’s 00:20 sailing to Westhaven from Pier 1 is on time. It is a separate service from Saturday’s cancelled 23:50 sailing.'},
  {day:1, time:'00:40', to:'Lark Island', pier:2, type:'normal'}
];
const labels = {cancelled:'Cancelled', boarding:'Boarding', normal:'On time', delayed:'Delayed'};
const icons = {cancelled:'cancel', boarding:'boarding', normal:'normal', delayed:'delay'};
const byId = id => document.getElementById(id);
const dialog = byId('details');
const filters = [...document.querySelectorAll('[data-pier]')];
let next;

function icon(name, extraClass = '') {
  return `<svg class="icon ${extraClass}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
}
function weekday(day) {
  return days[day].split(',')[0];
}
function minutes(sailing) {
  const {day, time} = sailing.revised || sailing;
  const [hour, minute] = time.split(':').map(Number);
  return day * 1440 + hour * 60 + minute;
}
function status(sailing) {
  const label = sailing.revised ? `Delayed · ${weekday(sailing.revised.day).slice(0,3)} ${sailing.revised.time}` : labels[sailing.type];
  return `<span class="status-line">${icon(icons[sailing.type])}${label}</span>`;
}
function updatePoster(visible) {
  next = visible.filter(s => s.type !== 'cancelled' && minutes(s) >= now).sort((a,b) => minutes(a) - minutes(b))[0];
  const departure = next.revised || next;
  byId('next-pier').textContent = next.pier;
  byId('next-time').textContent = departure.time;
  byId('next-time').dateTime = departure.time;
  byId('next-when').textContent = `${weekday(departure.day)} · In ${minutes(next) - now} min`;
  byId('next-to').textContent = next.to;
  let condition = labels[next.type];
  if (next.type === 'boarding') condition += ' · On time';
  if (next.revised) condition += ` from ${next.time}`;
  byId('next-state').innerHTML = icon(icons[next.type]) + condition;
}
function createRow(s) {
  const row = document.createElement('button');
  row.type = 'button';
  row.className = `row grid ${s.type}`;
  const service = s.revised ? `Delayed until ${weekday(s.revised.day)} ${s.revised.time}` : labels[s.type];
  row.setAttribute('aria-label', [days[s.day], s.time, s.to, `Pier ${s.pier}`, service, s.note, 'Sailing details'].filter(Boolean).join(', '));
  row.innerHTML = `<time class="sched" datetime="${s.time}">${s.time}</time>
    <span class="dest">${s.to}<small>Pier ${s.pier}</small></span><span class="pier">Pier ${s.pier}</span>
    <span class="status">${status(s)}${s.note ? `<span class="sub">${s.note}</span>` : ''}</span>${icon('chevron', 'row-arrow')}`;
  row.addEventListener('click', () => openDetail(s));
  return row;
}
function render(pier) {
  const visible = sailings.filter(s => !pier || s.pier === pier);
  updatePoster(visible);
  byId('count').textContent = `${visible.length} ${visible.length === 1 ? 'sailing' : 'sailings'}`;
  const groups = [];
  days.forEach((day, index) => {
    const group = visible.filter(s => s.day === index);
    if (!group.length) return;
    const section = document.createElement('section');
    section.className = 'group';
    const heading = document.createElement('h3');
    heading.textContent = day;
    heading.className = 'dayline';
    section.append(heading, ...group.map(createRow));
    groups.push(section);
  });
  byId('list').replaceChildren(...groups);
  filters.forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.pier) === pier)));
}
function openDetail(s) {
  byId('detail-name').textContent = s.to;
  byId('detail-time').textContent = s.time;
  byId('detail-time').dateTime = s.time;
  byId('detail-day').textContent = days[s.day];
  byId('detail-pier').textContent = `Pier ${s.pier}`;
  byId('detail-state').className = s.type;
  byId('detail-state').innerHTML = status(s) + (s.type === 'boarding' ? ' · On time' : '');
  byId('summary-text').textContent = s.summary || `${weekday(s.day)}’s ${s.time} sailing to ${s.to} from Pier ${s.pier} is on time.`;
  byId('feedback').textContent = '';
  dialog.showModal();
}
filters.forEach(button => button.addEventListener('click', () => {
  render(Number(button.dataset.pier));
  const departure = next.revised || next;
  byId('announcement').textContent = `${button.textContent}. Next departure ${weekday(departure.day)} ${departure.time} to ${next.to} from Pier ${next.pier}.`;
}));
document.querySelector('.open-detail').addEventListener('click', () => openDetail(next));
document.querySelector('.close').addEventListener('click', () => dialog.close());
dialog.addEventListener('click', event => {
  if (event.target !== dialog) return;
  const bounds = dialog.getBoundingClientRect();
  if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close();
});
document.querySelector('.copy').addEventListener('click', async () => {
  const summary = byId('summary-text');
  const range = document.createRange();
  range.selectNodeContents(summary);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  let copied = false;
  try {copied = document.execCommand('copy');} catch {}
  if (!copied && navigator.clipboard) {
    try {await navigator.clipboard.writeText(summary.textContent); copied = true;} catch {}
  }
  if (copied) selection.removeAllRanges();
  byId('feedback').textContent = copied ? 'Copied' : 'Summary selected for copying';
});
render(0);
</script>
</body>
</html>
